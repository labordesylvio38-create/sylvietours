<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nouvelle Mission</title>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#1a3c6e">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f0f4f8; color: #333; }
        .header { background: linear-gradient(135deg, #1a3c6e 0%, #2a6cb5 100%); color: white; box-shadow: 0 4px 15px rgba(26,60,110,0.4); }
        .header-logo { width: 100%; height: 80px; object-fit: cover; display: block; }
        .header-text { padding: 10px 15px 15px; text-align: center; }
        .header-text h1 { font-size: 17px; font-weight: bold; }
        .container { padding: 15px; max-width: 600px; margin: auto; padding-bottom: 40px; }
        .card { background: white; border-radius: 16px; padding: 20px; margin-top: 18px; box-shadow: 0 3px 12px rgba(0,0,0,0.08); }
        .card-title { font-size: 16px; font-weight: bold; color: #1a3c6e; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid #e8f0fe; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 6px; color: #555; }
        input { width: 100%; padding: 13px 14px; border: 2px solid #e8e8e8; border-radius: 10px; font-size: 15px; }
        input:focus { outline: none; border-color: #1a3c6e; }
        .btn { display: block; background: linear-gradient(135deg, #1a3c6e, #2a6cb5); color: white; padding: 15px; border-radius: 12px; font-size: 16px; font-weight: bold; border: none; cursor: pointer; width: 100%; text-align: center; margin-top: 10px; box-shadow: 0 5px 15px rgba(26,60,110,0.3); }
        .btn-retour { display: block; text-align: center; color: #1a3c6e; text-decoration: none; font-size: 14px; margin-top: 15px; padding: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header">
        <img src="/static/logo.jpg" class="header-logo" alt="Logo">
        <div class="header-text"><h1>Nouvelle Mission</h1></div>
    </div>
    <div class="container">
        <div class="card">
            <div class="card-title">➕ Informations de la mission</div>
            <form method="POST">
                <div class="form-group">
                    <label>📝 Nom / Référence</label>
                    <input type="text" name="nom" placeholder="Ex: Mission Alpha - Juin 2026" required>
                </div>
                <div class="form-group">
                    <label>🎖️ Chef de détachement</label>
                    <input type="text" name="client" placeholder="Ex: Lieutenant-Colonel DUPONT" required>
                </div>
                <div class="form-group">
                    <label>🔢 Numéro de facture</label>
                    <input type="text" name="numero_facture" placeholder="Ex: 011/26">
                </div>
                <div class="form-group">
                    <label>👥 Nombre de personnes</label>
                    <input type="number" name="nb_personnes" placeholder="Ex: 5" min="1" required>
                </div>
                <div class="form-group">
                    <label>📅 Date d'arrivée</label>
                    <input type="date" name="date_arrivee" required>
                </div>
                <div class="form-group">
                    <label>📅 Date de départ</label>
                    <input type="date" name="date_depart" required>
                </div>
                <button type="submit" class="btn">✅ Créer la mission</button>
            </form>
            <a href="/" class="btn-retour">← Retour à l'accueil</a>
        </div>
    </div>
</body>
</html>
